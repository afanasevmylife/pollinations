<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Pollinations — Journey progress</title>
        <style>
            @font-face {
                font-family: "Geist Pixel Square";
                src: url("fonts/geist-pixel-square.woff2") format("woff2");
                font-display: swap;
            }

            @font-face {
                font-family: "LCT Mogi";
                src: url("fonts/lct-mogi-a.woff2") format("woff2");
                font-display: swap;
            }

            :root {
                --preview: 58s;
                --start-free-start: 0.15s;
                --start-free-duration: 12.4s;
                --start-flight-start: 0.15s;
                --gen-start: 11.8s;
                --gen-duration: 17.2s;
                --friend-duration: 9s;
                --media-flight-start: 12.35s;
                --media-flight-duration: 12.4s;
                --start-flight-duration: calc(
                    var(--media-flight-start) - var(--start-flight-start)
                );
                --build-start: 25s;
                --build-duration: 11.4s;
                --build-flight-start: 25.2s;
                --build-flight-duration: 1.7s;
                --revenue-transition-start: 36.4s;
                --revenue-banner-start: 37.7s;
                --revenue-banner-duration: 12.1s;
                --revenue-start: 40.8s;
                --revenue-duration: 9s;
                --revenue-flight-duration: 2.1s;
                color-scheme: dark;
                background: #110518;
                font-family: "Geist Pixel Square", ui-monospace, monospace;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 16px;
                background: #110518;
            }

            main {
                width: min(100%, 960px);
            }

            .viewport {
                position: relative;
                width: 100%;
                aspect-ratio: 3 / 2;
                overflow: hidden;
                border: 2px solid #ecf874;
                border-radius: 18px;
                background: #fff9e9;
                isolation: isolate;
            }

            .world {
                position: absolute;
                top: 0;
                left: 0;
                z-index: 0;
                width: auto;
                max-width: none;
                height: 100%;
                image-rendering: pixelated;
                will-change: transform;
            }

            .playing .world {
                animation: world-travel var(--preview) linear forwards;
            }

            .light {
                position: absolute;
                inset: 0;
                z-index: 1;
                pointer-events: none;
                background: linear-gradient(115deg, rgb(255 244 190 / 6%), rgb(236 248 116 / 7%));
                mix-blend-mode: soft-light;
            }

            .opening-props {
                position: absolute;
                inset: 0 auto 0 0;
                z-index: 7;
                width: var(--world-width, 100%);
                pointer-events: none;
            }

            .playing .opening-props {
                animation: world-travel var(--preview) linear forwards;
            }

            .opening-friend {
                position: absolute;
                bottom: 25%;
                width: clamp(72px, 11vw, 112px);
                transform: translateX(-50%);
                transform-origin: 50% 100%;
                image-rendering: pixelated;
                filter: drop-shadow(4px 6px 0 rgb(17 5 24 / 16%));
            }

            .opening-friend img {
                display: block;
                width: 100%;
                height: auto;
                image-rendering: pixelated;
            }

            .opening-friend--robot {
                left: 1.05%;
            }

            .opening-friend--robot img {
                animation: robot-welcome-idle 1.6s steps(2, end) infinite;
            }

            .opening-friend--nomnom {
                left: 7.6%;
                bottom: 24.5%;
                width: clamp(66px, 10vw, 104px);
            }

            .opening-friend--nomnom img {
                animation: nomnom-welcome-idle 1.25s steps(2, end) 180ms infinite;
            }

            .polli {
                --polli-entry-left: 23%;
                --polli-entry-bottom: 42%;
                --polli-entry-width: 3.6%;
                --polli-curve-one-left: 22%;
                --polli-curve-one-width: 4.8%;
                --polli-curve-two-left: 25%;
                --polli-curve-two-width: 6.4%;
                --polli-curve-three-left: 30%;
                --polli-curve-three-width: 8.2%;
                --polli-curve-four-left: 34%;
                --polli-curve-four-width: 9.8%;
                --polli-rest-left: 38%;
                --polli-rest-bottom: 25.5%;
                --polli-rest-width: clamp(72px, 11.5%, 128px);
                position: absolute;
                z-index: 11;
                left: var(--polli-rest-left);
                bottom: var(--polli-rest-bottom);
                width: var(--polli-rest-width);
                aspect-ratio: 160 / 200;
                image-rendering: pixelated;
                filter: drop-shadow(4px 6px 0 rgb(17 5 24 / 18%));
                visibility: hidden;
            }

            .polli::after {
                content: "";
                position: absolute;
                right: 18%;
                bottom: -3%;
                left: 18%;
                z-index: -1;
                height: 8%;
                border-radius: 50%;
                background: rgb(17 5 24 / 16%);
                filter: blur(2px);
            }

            .polli__ground,
            .polli__flight {
                position: absolute;
                inset: 0;
                transform-origin: 50% 60%;
            }

            .polli__ground {
                transform: scale(1);
            }

            .polli__sprite {
                width: 100%;
                height: 100%;
                background: url("polli-walk-frame.png") center / contain no-repeat;
            }

            .polli__flight {
                transform: scale(0);
            }

            .polli__flight-frame {
                position: absolute;
                top: 0;
                left: 50%;
                width: auto;
                max-width: none;
                height: 100%;
                image-rendering: pixelated;
                transform: translateX(-50%) scale(1);
            }

            .polli__flight-frame:last-child {
                transform: translateX(-50%) scale(0);
            }

            .arriving .polli {
                visibility: visible;
                animation: polli-entry 4.2s ease-in-out both;
            }

            .playing .polli {
                visibility: visible;
                animation:
                    polli-start-flight var(--start-flight-duration) linear
                        var(--start-flight-start) both,
                    polli-media-flight var(--media-flight-duration) linear
                        var(--media-flight-start) forwards,
                    polli-build-flight var(--build-flight-duration) ease-in
                        var(--build-flight-start) forwards,
                    polli-revenue-rise var(--revenue-flight-duration) ease-in-out
                        var(--revenue-transition-start) forwards;
            }

            .playing .polli__ground {
                animation:
                    ground-layer var(--start-flight-duration) linear var(--start-flight-start) both,
                    ground-layer var(--media-flight-duration) linear var(--media-flight-start)
                        forwards,
                    ground-build-layer var(--build-flight-duration) linear var(--build-flight-start)
                        forwards;
            }

            .arriving .polli__sprite,
            .playing .polli__sprite {
                animation: walk-cycle 460ms steps(2, end) infinite;
            }

            .playing .polli__flight {
                animation:
                    flight-layer var(--start-flight-duration) linear var(--start-flight-start) both,
                    flight-layer var(--media-flight-duration) linear var(--media-flight-start)
                        forwards,
                    flight-build-layer var(--build-flight-duration) linear var(--build-flight-start)
                        forwards;
            }

            .playing .polli::after {
                animation:
                    shadow-layer var(--start-flight-duration) linear var(--start-flight-start) both,
                    shadow-layer var(--media-flight-duration) linear var(--media-flight-start)
                        forwards,
                    shadow-build-layer var(--build-flight-duration) linear var(--build-flight-start)
                        forwards;
            }

            .playing .polli__flight-frame:first-child {
                animation: flight-up 150ms steps(1, end) infinite;
            }

            .playing .polli__flight-frame:last-child {
                animation: flight-down 150ms steps(1, end) infinite;
            }

            .quest-board {
                position: absolute;
                z-index: 9;
                top: 32%;
                left: 72%;
                width: min(42%, 400px);
                aspect-ratio: 2 / 1;
                image-rendering: pixelated;
                filter: drop-shadow(4px 6px 0 rgb(17 5 24 / 16%));
                visibility: hidden;
                transform: translateX(140%) scale(0.9);
                transform-origin: 50% 50%;
            }

            .quest-board__face {
                position: absolute;
                inset: 0;
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
                visibility: hidden;
                transform: scaleY(0);
            }

            .playing .quest-board {
                animation: quest-board-sequence var(--start-free-duration) linear both;
                animation-delay: var(--start-free-start);
            }

            .playing .quest-board__face--one {
                animation: quest-face-one var(--start-free-duration) linear both;
                animation-delay: var(--start-free-start);
            }

            .playing .quest-board__face--two {
                animation: quest-face-two var(--start-free-duration) linear both;
                animation-delay: var(--start-free-start);
            }

            .playing .quest-board__face--three {
                animation: quest-face-three var(--start-free-duration) linear both;
                animation-delay: var(--start-free-start);
            }

            .quest-wallet {
                position: absolute;
                z-index: 10;
                bottom: 4%;
                left: 2.5%;
                width: min(32%, 320px);
                aspect-ratio: 2 / 1;
                image-rendering: pixelated;
                filter: drop-shadow(3px 5px 0 rgb(17 5 24 / 16%));
                visibility: hidden;
                transform: translateY(20px) scale(0.08, 0.03) rotate(-4deg);
                transform-origin: 50% 100%;
            }

            .quest-wallet__state {
                position: absolute;
                inset: 0;
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
                visibility: hidden;
            }

            .playing .quest-wallet {
                animation: quest-wallet-sequence var(--start-free-duration) linear both;
                animation-delay: var(--start-free-start);
            }

            .playing .quest-wallet__state--empty {
                animation: wallet-state-empty var(--start-free-duration) linear both;
                animation-delay: var(--start-free-start);
            }

            .playing .quest-wallet__state--low {
                animation: wallet-state-low var(--start-free-duration) linear both;
                animation-delay: var(--start-free-start);
            }

            .playing .quest-wallet__state--high {
                animation: wallet-state-high var(--start-free-duration) linear both;
                animation-delay: var(--start-free-start);
            }

            .pollen-grain {
                --pollen-drop: 13vw;
                --pollen-end-x: -46vw;
                position: absolute;
                z-index: 11;
                top: 55%;
                left: 70%;
                width: clamp(10px, 1.8%, 18px);
                aspect-ratio: 1;
                background: #ecf874;
                border: max(1px, 0.18vw) solid #015d2d;
                border-radius: 42% 58% 46% 54%;
                box-shadow: inset 0 0 0 max(1px, 0.18vw) #61c380;
                filter: drop-shadow(1px 2px 0 rgb(17 5 24 / 24%));
                visibility: hidden;
                pointer-events: none;
            }

            .pollen-grain::before,
            .pollen-grain::after {
                content: "";
                position: absolute;
                aspect-ratio: 1;
            }

            .pollen-grain::before {
                top: -42%;
                right: -18%;
                width: 34%;
                background: #d7f9de;
                border: 1px solid #61c380;
            }

            .pollen-grain::after {
                top: 70%;
                left: -22%;
                width: 22%;
                background: #fff9c7;
            }

            .pollen-grain--paid {
                background: #fff0c1;
                border-color: #6c4800;
                box-shadow: inset 0 0 0 max(1px, 0.18vw) #eabf13;
            }

            .pollen-grain--paid::before {
                background: #fff0c1;
                border-color: #eabf13;
            }

            .pollen-grain--paid::after {
                background: #fff9e9;
            }

            .playing .pollen-grain--in {
                animation: pollen-flight 1.4s cubic-bezier(0.28, 0.74, 0.32, 1)
                    var(--pollen-delay) both;
            }

            .pollen-grain--out {
                --pollen-mid-x: 20vw;
                --pollen-target-x: 42vw;
                --pollen-mid-y: -7vw;
                --pollen-target-y: -15vw;
                top: 80%;
                left: var(--pollen-source);
                width: clamp(12px, 2.2%, 22px);
            }

            .playing .pollen-grain--out {
                animation: pollen-spend 2.1s cubic-bezier(0.3, 0.65, 0.32, 1)
                    var(--pollen-delay) both;
            }

            .pollen-grain--revenue {
                top: 51%;
                left: 54%;
                width: clamp(11px, 1.8%, 19px);
            }

            .playing .pollen-grain--revenue {
                animation: pollen-revenue 1.35s cubic-bezier(0.28, 0.72, 0.3, 1)
                    var(--pollen-delay) both;
            }

            .pollen-stream {
                display: contents;
            }

            .spark {
                position: absolute;
                z-index: 11;
                left: var(--x);
                bottom: var(--y);
                width: clamp(7px, 1.35%, 14px);
                aspect-ratio: 1;
                background: #ecf874;
                box-shadow: 0 -100% #fff9c7, 100% 0 #fff9c7, 0 100% #fff9c7,
                    -100% 0 #fff9c7;
                filter: drop-shadow(1px 2px 0 rgb(17 5 24 / 48%));
                visibility: hidden;
            }

            .playing .spark {
                animation: wallet-spark var(--start-free-duration) linear both;
                animation-delay: calc(var(--start-free-start) + var(--spark-delay));
            }

            .phase-banner {
                position: absolute;
                z-index: 12;
                top: -6%;
                left: 50%;
                width: min(88%, 860px);
                image-rendering: pixelated;
                filter: drop-shadow(5px 8px 0 rgb(17 5 24 / 18%));
                visibility: hidden;
                transform: translate(-50%, -145%) rotate(-2deg);
                transform-origin: 50% 0;
            }

            .playing .phase-banner {
                animation: phase-banner var(--phase-duration) linear var(--phase-start) both;
            }

            .capability-friend {
                position: absolute;
                z-index: 10;
                bottom: calc(27.5% - var(--friend-ground-offset, 0vw));
                left: 0;
                width: clamp(150px, var(--friend-size, 21%), 250px);
                aspect-ratio: 1;
                image-rendering: pixelated;
                filter: drop-shadow(5px 7px 0 rgb(17 5 24 / 18%));
                visibility: hidden;
                transform: translateX(110vw);
                pointer-events: none;
            }

            .capability-friend__frame {
                position: absolute;
                inset: 0;
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
                visibility: hidden;
            }

            .playing .capability-friend {
                animation: capability-cross var(--friend-duration) linear var(--friend-start) both;
            }

            .playing .capability-friend__frame--one {
                animation: capability-frame-one 560ms steps(1, end) var(--friend-start) infinite;
            }

            .playing .capability-friend__frame--two {
                animation: capability-frame-two 560ms steps(1, end) var(--friend-start) infinite;
            }

            .playing .capability-friend__frame--three {
                animation: capability-frame-three 560ms steps(1, end) var(--friend-start) infinite;
            }

            .world-props {
                position: absolute;
                inset: 0 auto 0 0;
                z-index: 8;
                width: var(--world-width, 100%);
                pointer-events: none;
                visibility: hidden;
            }

            .playing .world-props {
                animation: world-travel var(--preview) linear forwards;
                visibility: visible;
            }

            .build-landmark {
                position: absolute;
                bottom: var(--landmark-bottom, 24%);
                left: 0;
                width: clamp(170px, var(--landmark-size, 30vw), 330px);
                transform: translateX(-50%);
                transform-origin: 50% 100%;
                image-rendering: pixelated;
            }

            .build-landmark__scene {
                position: relative;
                width: 100%;
                transform-origin: 50% 100%;
            }

            .playing .build-landmark__scene {
                animation: landmark-activate 3.3s ease-in-out
                    calc(var(--landmark-center) - 1.45s) both;
            }

            .playing .build-landmark--burst .build-landmark__scene {
                animation: landmark-seed-burst 1.05s cubic-bezier(0.2, 0.82, 0.28, 1.18)
                    calc(var(--landmark-center) - 1.15s) both;
            }

            .landmark-burst {
                position: absolute;
                bottom: 5%;
                left: 50%;
                z-index: 4;
                width: 7%;
                aspect-ratio: 1;
                border-radius: 50%;
                background: #ecf874;
                box-shadow:
                    -3.2vw -0.7vw 0 -0.4vw #f8d86b,
                    3.2vw -0.7vw 0 -0.4vw #f8d86b,
                    -2.1vw -2.4vw 0 -0.5vw #8ff0af,
                    2.1vw -2.4vw 0 -0.5vw #8ff0af,
                    -4.2vw -2vw 0 -0.55vw #fff2bd,
                    4.2vw -2vw 0 -0.55vw #fff2bd;
                visibility: hidden;
                transform: translate(-50%, 50%) scale(0);
            }

            .playing .build-landmark--burst .landmark-burst {
                animation: landmark-burst-particles 720ms steps(6, end)
                    calc(var(--landmark-center) - 0.94s) both;
            }

            .build-landmark__asset {
                display: block;
                width: 100%;
                height: auto;
                image-rendering: pixelated;
                filter: drop-shadow(5px 8px 0 rgb(17 5 24 / 16%));
            }

            .build-landmark--cli .build-landmark__asset {
                animation: terminal-glow 1.4s steps(2, end) infinite;
            }

            .build-landmark--wallet .build-landmark__asset {
                animation: wallet-glow 1.9s steps(2, end) infinite;
            }

            .build-landmark--mcp .build-landmark__asset {
                animation: connector-glow 1.8s ease-in-out infinite;
            }

            .build-landmark--storage .build-landmark__asset {
                animation: storage-breathe 2.4s ease-in-out infinite;
            }

            .revenue-stage {
                position: absolute;
                inset: 17% 0 0;
                z-index: 9;
                overflow: hidden;
                pointer-events: none;
            }

            .revenue-scene,
            .revenue-agent-state,
            .revenue-media-token,
            .revenue-burst {
                position: absolute;
                visibility: hidden;
            }

            .revenue-scene {
                inset: 0;
            }

            .revenue-scene__asset {
                position: absolute;
                display: block;
                image-rendering: pixelated;
                filter: drop-shadow(5px 8px 0 rgb(17 5 24 / 18%));
            }

            .revenue-scene--pollen .revenue-scene__asset {
                bottom: 4%;
                left: 50%;
                width: min(35%, 340px);
                transform: translateX(-50%);
            }

            .revenue-connection-ring {
                position: absolute;
                bottom: 21%;
                left: 50%;
                width: min(48%, 450px);
                aspect-ratio: 2.1 / 1;
                border: max(2px, 0.25vw) dashed #ecf874;
                border-radius: 50%;
                box-shadow:
                    inset 0 0 0 max(2px, 0.18vw) rgb(97 195 128 / 55%),
                    0 0 1.1vw rgb(236 248 116 / 70%);
                transform: translateX(-50%);
            }

            .revenue-connection-ring::before,
            .revenue-connection-ring::after {
                content: "";
                position: absolute;
                top: 45%;
                width: 7%;
                aspect-ratio: 1;
                border: max(1px, 0.15vw) solid #015d2d;
                border-radius: 50%;
                background: #ecf874;
                box-shadow: 0 0 0.7vw #ecf874;
            }

            .revenue-connection-ring::before {
                left: -3%;
            }

            .revenue-connection-ring::after {
                right: -3%;
                background: #8ff0af;
            }

            .revenue-scene--models .revenue-scene__asset {
                bottom: -1%;
                left: 50%;
                width: min(58%, 560px);
                max-height: 94%;
                object-fit: contain;
                transform: translateX(-50%);
            }

            .revenue-agent-state {
                bottom: -5%;
                left: 50%;
                display: block;
                width: min(38%, 360px);
                max-height: 98%;
                object-fit: contain;
                image-rendering: pixelated;
                filter: drop-shadow(6px 9px 0 rgb(17 5 24 / 20%));
                transform: translateX(-50%);
            }

            .revenue-agent-state--rocket {
                bottom: -2%;
                width: min(44%, 420px);
            }

            .revenue-media-token {
                top: 37%;
                left: 50%;
                width: min(12%, 112px);
                aspect-ratio: 1;
                background-image: url("revenue-stop-v1/media-sprite-v1.png");
                background-size: 200% 200%;
                background-position: var(--media-x) var(--media-y);
                image-rendering: pixelated;
                filter: drop-shadow(3px 5px 0 rgb(17 5 24 / 18%));
            }

            .revenue-burst {
                top: 48%;
                left: 50%;
                width: 2.2%;
                aspect-ratio: 1;
                border-radius: 50%;
                background: #ecf874;
                box-shadow:
                    -9vw -4vh 0 #f8d86b,
                    9vw -5vh 0 #8ff0af,
                    -12vw 5vh 0 #fff2bd,
                    11vw 7vh 0 #d78cff,
                    -4vw -10vh 0 #61c380,
                    4vw 11vh 0 #ecf874;
                transform: translate(-50%, -50%) scale(0);
            }

            .playing .revenue-scene--pollen {
                animation: revenue-pollen-scene var(--revenue-duration) linear
                    var(--revenue-start) both;
            }

            .playing .revenue-connection-ring {
                animation: revenue-ring var(--revenue-duration) steps(18, end)
                    var(--revenue-start) both;
            }

            .playing .revenue-scene--models {
                animation: revenue-model-scene var(--revenue-duration) linear
                    var(--revenue-start) both;
            }

            .playing .revenue-agent-state--walk {
                animation: revenue-agent-walk var(--revenue-duration) linear
                    var(--revenue-start) both;
            }

            .playing .revenue-agent-state--confused {
                animation: revenue-agent-work var(--revenue-duration) linear
                    var(--revenue-start) both;
            }

            .playing .revenue-agent-state--rocket {
                animation: revenue-agent-rocket var(--revenue-duration) linear
                    var(--revenue-start) both;
            }

            .playing .revenue-media-token {
                animation: revenue-media-fall 1.45s cubic-bezier(0.3, 0.7, 0.35, 1)
                    calc(var(--revenue-start) + var(--media-delay)) both;
            }

            .playing .revenue-burst--one {
                animation: revenue-burst 620ms steps(7, end)
                    calc(var(--revenue-start) + 2.35s) both;
            }

            .playing .revenue-burst--two {
                animation: revenue-burst 620ms steps(7, end)
                    calc(var(--revenue-start) + 5.05s) both;
            }

            .storage-light {
                position: absolute;
                z-index: 3;
                display: block;
                aspect-ratio: 1;
                border-radius: 3px;
                background: #ecf874;
                box-shadow: 0 0 0.65vw #ecf874;
                transform: scale(0.55);
            }

            .landmark-pulse {
                position: absolute;
                z-index: 3;
                width: 5%;
                aspect-ratio: 1;
                border-radius: 50%;
                background: #ecf874;
                box-shadow: 0 0 0.8vw #ecf874;
                animation: landmark-pulse 1.2s steps(3, end) var(--pulse-delay, 0s) infinite;
            }

            .build-landmark--mcp .landmark-pulse:nth-of-type(1) {
                top: 17%;
                left: 49%;
            }

            .build-landmark--mcp .landmark-pulse:nth-of-type(2) {
                top: 36%;
                left: 17%;
            }

            .build-landmark--mcp .landmark-pulse:nth-of-type(3) {
                top: 36%;
                right: 17%;
            }

            .storage-light {
                width: 3.8%;

        <script>
            const viewport = document.querySelector("#viewport");
            const world = document.querySelector("#world");
            const openingProps = document.querySelector("#opening-props");
            const worldProps = document.querySelector("#world-props");
            const buildLandmarks = [...document.querySelectorAll(".build-landmark")];
            const phaseControls = [
                ...document.querySelectorAll("[data-phase-time], [data-phase-var]"),
            ];
            const pollenStream = document.querySelector("#pollen-stream");
            const questPollenStream = document.querySelector("#quest-pollen-stream");
            const revenuePollenStream = document.querySelector("#revenue-pollen-stream");
            const fullJourneySeconds = 65;
            const movingPreviewSeconds = 49;
            const pauseStartSeconds = 40.8;
            const arrivalHoldMs = 1000;
            const arrivalDurationMs = 4200;
            let arrivalTimer;
            let playTimer;

            const questRewardBursts = [
                { start: 5.3, count: 5, spacing: 0.14 },
                { start: 7.2, count: 14, spacing: 0.1 },
            ];

            for (const burst of questRewardBursts) {
                for (let index = 0; index < burst.count; index += 1) {
                    const grain = document.createElement("i");
                    grain.className = "pollen-grain pollen-grain--in";
                    grain.style.setProperty(
                        "--pollen-delay",
                        `calc(var(--start-free-start) + ${burst.start + index * burst.spacing}s)`,
                    );
                    grain.style.setProperty("--arc-x", `${((index % 7) - 3) * 0.9}vw`);
                    grain.style.setProperty("--arc-y", `${((index % 5) - 2) * 0.75}vw`);
                    questPollenStream.append(grain);
                }
            }

            const mediaFirstCenter = 16.1;
            const mediaLastCenter = 21.2;
            const pollenSpendDuration = 2.1;
            const pollenStep = 0.55;
            const pollenBursts = Math.floor(
                (mediaLastCenter - mediaFirstCenter - pollenSpendDuration) / pollenStep,
            );

            for (let index = 0; index <= pollenBursts; index += 1) {
                for (const account of ["paid", "quest"]) {
                    const grain = document.createElement("i");
                    grain.className = `pollen-grain pollen-grain--out${
                        account === "paid" ? " pollen-grain--paid" : ""
                    }`;
                    grain.style.setProperty(
                        "--pollen-delay",
                        `${mediaFirstCenter + index * pollenStep + (account === "quest" ? 0.16 : 0)}s`,
                    );
                    grain.style.setProperty("--pollen-source", account === "paid" ? "14%" : "26%");
                    grain.style.setProperty(
                        "--pollen-source-mobile",
                        account === "paid" ? "14%" : "35%",
                    );
                    const targetX =
                        (account === "paid" ? 40 : 32) + ((index % 4) - 1.5) * 3;
                    grain.style.setProperty("--pollen-mid-x", `${targetX * 0.46}vw`);
                    grain.style.setProperty("--pollen-target-x", `${targetX}vw`);
                    grain.style.setProperty(
                        "--pollen-target-y",
                        `${-14 - (index % 3) * 0.8}vw`,
                    );
                    pollenStream.append(grain);
                }
            }

            for (const beatStart of [1.05, 3.55, 6.35]) {
                for (let index = 0; index < 6; index += 1) {
                    for (const account of ["paid", "quest"]) {
                        const grain = document.createElement("i");
                        grain.className = `pollen-grain pollen-grain--revenue${
                            account === "paid" ? " pollen-grain--paid" : ""
                        }`;
                        grain.style.setProperty(
                            "--pollen-delay",
                            `${pauseStartSeconds + beatStart + index * 0.12 + (account === "quest" ? 0.06 : 0)}s`,
                        );
                        grain.style.setProperty(
                            "--earn-target-x",
                            account === "paid" ? "-45vw" : "-32vw",
                        );
                        grain.style.setProperty(
                            "--earn-mid-x",
                            account === "paid" ? "-27vw" : "-19vw",
                        );
                        revenuePollenStream.append(grain);
                    }
                }
            }

            function setJourney() {
                const viewportWidth = viewport.getBoundingClientRect().width;
                const worldWidth = world.getBoundingClientRect().width;
                const maximumTravel = Math.max(0, worldWidth - viewportWidth);
                const pixelsPerSecond = maximumTravel / fullJourneySeconds;

                openingProps.style.width = `${worldWidth}px`;
                worldProps.style.width = `${worldWidth}px`;
                for (const landmark of buildLandmarks) {
                    const centerTime = Number(landmark.dataset.centerTime);
                    landmark.style.setProperty("--landmark-center", `${centerTime}s`);
                    landmark.style.left = `${pixelsPerSecond * centerTime + viewportWidth * 0.65}px`;
                }

                viewport.style.setProperty(
                    "--world-end",
                    `${-(pixelsPerSecond * movingPreviewSeconds)}px`,
                );
                viewport.style.setProperty(
                    "--world-pause",
                    `${-(pixelsPerSecond * pauseStartSeconds)}px`,
                );
            }

            function play() {
                viewport.classList.remove("arriving");
                viewport.classList.remove("playing");
                void viewport.offsetWidth;
                viewport.classList.add("playing");
            }

            function playFrom(seconds) {
                window.clearTimeout(arrivalTimer);
                window.clearTimeout(playTimer);
                viewport.classList.remove("arriving");
                setJourney();
                play();
                window.requestAnimationFrame(() => {
                    for (const animation of viewport.getAnimations({ subtree: true })) {
                        animation.currentTime = seconds * 1000;
                    }
                });
            }

            function begin() {
                window.clearTimeout(arrivalTimer);
                window.clearTimeout(playTimer);
                viewport.classList.remove("arriving");
                viewport.classList.remove("playing");
                setJourney();
                arrivalTimer = window.setTimeout(() => {
                    viewport.classList.add("arriving");
                    playTimer = window.setTimeout(play, arrivalDurationMs);
                }, arrivalHoldMs);
            }

            if (world.complete) {
                begin();
            } else {
                world.addEventListener("load", begin);
            }
            window.addEventListener("resize", setJourney);
            for (const control of phaseControls) {
                control.addEventListener("click", () => {
                    const seconds = control.dataset.phaseVar
                        ? Number.parseFloat(
                              getComputedStyle(document.documentElement).getPropertyValue(
                                  control.dataset.phaseVar,
                              ),
                          )
                        : Number(control.dataset.phaseTime);
                    if (seconds === 0) {
                        begin();
                    } else {
                        playFrom(seconds);
                    }
                });
            }
