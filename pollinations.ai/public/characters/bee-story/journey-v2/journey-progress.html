<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Pollinations — Journey progress</title>
        <style>
            @font-face {
                font-family: "Geist Pixel Square";
                src: url("fonts/geist-pixel-square.woff2") format("woff2");
                font-display: swap;
            }

            :root {
                --preview: 68s;
                --panorama-duration: 65s;
                --start-free-start: 0.15s;
                --start-free-duration: 12.4s;
                --start-flight-start: 0.15s;
                --gen-start: 11.8s;
                --gen-duration: 17.2s;
                --friend-duration: 9s;
                --media-flight-start: 12.35s;
                --media-flight-duration: 12.4s;
                --start-flight-duration: calc(
                    var(--media-flight-start) - var(--start-flight-start)
                );
                --build-start: 25s;
                --build-duration: 11.4s;
                --build-flight-start: 25.2s;
                --build-flight-duration: 1.7s;
                --revenue-transition-start: 36.4s;
                --revenue-banner-start: 37.7s;
                --revenue-banner-duration: 11.1s;
                --revenue-start: 39.65s;
                --revenue-duration: 9s;
                --revenue-flight-duration: 2.1s;
                --community-start: 48.65s;
                --community-duration: 19.35s;
                color-scheme: dark;
                background: #110518;
                font-family: "Geist Pixel Square", ui-monospace, monospace;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 16px;
                background: #110518;
            }

            main {
                width: min(100%, 960px);
            }

            .viewport {
                position: relative;
                container-type: size;
                width: 100%;
                aspect-ratio: 3 / 2;
                overflow: hidden;
                border: 2px solid #ecf874;
                border-radius: 18px;
                background: #fff9e9;
                isolation: isolate;
            }

            .world {
                position: absolute;
                top: 0;
                left: 0;
                z-index: 0;
                width: auto;
                max-width: none;
                height: 100%;
                image-rendering: pixelated;
                will-change: transform;
            }

            .light {
                position: absolute;
                inset: 0;
                z-index: 1;
                pointer-events: none;
                background: linear-gradient(115deg, rgb(255 244 190 / 6%), rgb(236 248 116 / 7%));
                mix-blend-mode: soft-light;
            }

            .opening-props {
                position: absolute;
                inset: 0 auto 0 0;
                z-index: 7;
                width: var(--world-width, 100%);
                pointer-events: none;
            }

            .opening-friend {
                position: absolute;
                bottom: 25%;
                width: 11cqw;
                transform: translateX(-50%);
                transform-origin: 50% 100%;
                image-rendering: pixelated;
                filter: drop-shadow(4px 6px 0 rgb(17 5 24 / 16%));
            }

            .opening-friend img {
                display: block;
                width: 100%;
                height: auto;
                image-rendering: pixelated;
            }

            .opening-friend--robot {
                left: 1.05%;
            }

            .opening-friend--robot img {
                animation: robot-welcome-idle 1.6s steps(2, end) infinite;
            }

            .opening-friend--nomnom {
                left: 7.6%;
                bottom: 24.5%;
                width: 10cqw;
            }

            .opening-friend--nomnom img {
                animation: nomnom-welcome-idle 1.25s steps(2, end) 180ms infinite;
            }

            .polli {
                --polli-entry-left: 23%;
                --polli-entry-bottom: 42%;
                --polli-entry-width: 3.6cqw;
                --polli-curve-one-left: 22%;
                --polli-curve-one-width: 4.8cqw;
                --polli-curve-two-left: 25%;
                --polli-curve-two-width: 6.4cqw;
                --polli-curve-three-left: 30%;
                --polli-curve-three-width: 8.2cqw;
                --polli-curve-four-left: 34%;
                --polli-curve-four-width: 9.8cqw;
                --polli-rest-left: 38%;
                --polli-rest-bottom: 25.5%;
                --polli-rest-width: 11.5cqw;
                position: absolute;
                z-index: 11;
                left: var(--polli-rest-left);
                bottom: var(--polli-rest-bottom);
                width: var(--polli-rest-width);
                aspect-ratio: 160 / 200;
                image-rendering: pixelated;
                filter: drop-shadow(4px 6px 0 rgb(17 5 24 / 18%));
                visibility: hidden;
            }

            .polli::after {
                content: "";
                position: absolute;
                right: 18%;
                bottom: -3%;
                left: 18%;
                z-index: -1;
                height: 8%;
                border-radius: 50%;
                background: rgb(17 5 24 / 16%);
                filter: blur(2px);
            }

            .polli__ground,
            .polli__flight {
                position: absolute;
                inset: 0;
                transform-origin: 50% 60%;
            }

            .polli__ground {
                transform: scale(1);
            }

            .polli__sprite {
                width: 100%;
                height: 100%;
                background: url("polli-walk-frame.png") center / contain no-repeat;
            }

            .polli__flight {
                transform: scale(0);
            }

            .polli__flight-frame {
                position: absolute;
                top: 0;
                left: 50%;
                width: auto;
                max-width: none;
                height: 100%;
                image-rendering: pixelated;
                transform: translateX(-50%) scale(1);
            }

            .polli__flight-frame:last-child {
                transform: translateX(-50%) scale(0);
            }

            .arriving .polli {
                visibility: visible;
                animation: polli-entry 4.2s ease-in-out both;
            }

            .playing .polli {
                z-index: 22;
                visibility: visible;
                animation:
                    polli-start-flight var(--start-flight-duration) linear
                        var(--start-flight-start) both,
                    polli-media-flight var(--media-flight-duration) linear
                        var(--media-flight-start) forwards,
                    polli-build-flight var(--build-flight-duration) ease-in
                        var(--build-flight-start) forwards,
                    polli-revenue-settle var(--revenue-flight-duration) ease-in-out
                        var(--revenue-transition-start) forwards,
                    polli-community-gather 900ms ease-in-out
                        calc(var(--revenue-start) + 8.1s) forwards,
                    polli-community-walk var(--community-duration) linear
                        var(--community-start) forwards,
                    polli-community-resize 650ms ease-in-out
                        calc(var(--community-start) - 0.55s) forwards;
            }

            .playing .polli__ground {
                animation:
                    ground-layer var(--start-flight-duration) linear var(--start-flight-start) both,
                    ground-layer var(--media-flight-duration) linear var(--media-flight-start)
                        forwards,
                    ground-build-layer var(--build-flight-duration) linear var(--build-flight-start)
                        forwards,
                    community-ground-layer 1ms linear var(--community-start) forwards;
            }

            .arriving .polli__sprite {
                animation: walk-cycle 460ms steps(2, end) infinite;
            }

            .playing .polli__sprite {
                animation:
                    walk-cycle 460ms steps(2, end) infinite,
                    community-polli-celebrate 900ms steps(3, end)
                        calc(var(--community-start) + 17s) 2 both;
            }

            .playing .polli__flight {
                animation:
                    flight-layer var(--start-flight-duration) linear var(--start-flight-start) both,
                    flight-layer var(--media-flight-duration) linear var(--media-flight-start)
                        forwards,
                    flight-build-layer var(--build-flight-duration) linear var(--build-flight-start)
                        forwards,
                    community-flight-layer 1ms linear var(--community-start) forwards;
            }

            .playing .polli::after {
                animation:
                    shadow-layer var(--start-flight-duration) linear var(--start-flight-start) both,
                    shadow-layer var(--media-flight-duration) linear var(--media-flight-start)
                        forwards,
                    shadow-build-layer var(--build-flight-duration) linear var(--build-flight-start)
                        forwards,
                    community-shadow-layer 1ms linear var(--community-start) forwards;
            }

            .playing .polli__flight-frame:first-child {
                animation: flight-up 150ms steps(1, end) infinite;
            }

            .playing .polli__flight-frame:last-child {
                animation: flight-down 150ms steps(1, end) infinite;
            }

            .quest-board {
                position: absolute;
                z-index: 9;
                top: 32%;
                left: 72%;
                width: 42cqw;
                aspect-ratio: 2 / 1;
                image-rendering: pixelated;
                filter: drop-shadow(4px 6px 0 rgb(17 5 24 / 16%));
                visibility: hidden;
                transform: translateX(140%) scale(0.9);
                transform-origin: 50% 50%;
            }

            .quest-board__face {
                position: absolute;
                inset: 0;
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
                visibility: hidden;
                transform: scaleY(0);
            }

            .playing .quest-board {
                animation: quest-board-sequence var(--start-free-duration) linear both;
                animation-delay: var(--start-free-start);
            }

            .playing .quest-board__face--one {
                animation: quest-face-one var(--start-free-duration) linear both;
                animation-delay: var(--start-free-start);
            }

            .playing .quest-board__face--two {
                animation: quest-face-two var(--start-free-duration) linear both;
                animation-delay: var(--start-free-start);
            }

            .playing .quest-board__face--three {
                animation: quest-face-three var(--start-free-duration) linear both;
                animation-delay: var(--start-free-start);
            }

            .quest-wallet {
                position: absolute;
                z-index: 10;
                bottom: 4%;
                left: 2.5%;
                width: 32cqw;
                aspect-ratio: 2 / 1;
                image-rendering: pixelated;
                filter: drop-shadow(3px 5px 0 rgb(17 5 24 / 16%));
                visibility: hidden;
                transform: translateY(20px) scale(0.08, 0.03) rotate(-4deg);
                transform-origin: 50% 100%;
            }

            .quest-wallet__state {
                position: absolute;
                inset: 0;
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
                visibility: hidden;
            }

            .playing .quest-wallet {
                animation: quest-wallet-sequence var(--start-free-duration) linear both;
                animation-delay: var(--start-free-start);
            }

            .playing .quest-wallet__state--empty {
                animation: wallet-state-empty var(--start-free-duration) linear both;
                animation-delay: var(--start-free-start);
            }

            .playing .quest-wallet__state--low {
                animation: wallet-state-low var(--start-free-duration) linear both;
                animation-delay: var(--start-free-start);
            }

            .playing .quest-wallet__state--high {
                animation: wallet-state-high var(--start-free-duration) linear both;
                animation-delay: var(--start-free-start);
            }

            .pollen-grain {
                --pollen-drop: 13cqw;
                --pollen-end-x: -46cqw;
                position: absolute;
                z-index: 11;
                top: 55%;
                left: 70%;
                width: 1.8cqw;
                aspect-ratio: 1;
                background: #ecf874;
                border: max(1px, 0.18cqw) solid #015d2d;
                border-radius: 42% 58% 46% 54%;
                box-shadow: inset 0 0 0 max(1px, 0.18cqw) #61c380;
                filter: drop-shadow(1px 2px 0 rgb(17 5 24 / 24%));
                visibility: hidden;
                pointer-events: none;
            }

            .pollen-grain::before,
            .pollen-grain::after {
                content: "";
                position: absolute;
                aspect-ratio: 1;
            }

            .pollen-grain::before {
                top: -42%;
                right: -18%;
                width: 34%;
                background: #d7f9de;
                border: 1px solid #61c380;
            }

            .pollen-grain::after {
                top: 70%;
                left: -22%;
                width: 22%;
                background: #fff9c7;
            }

            .pollen-grain--paid {
                background: #fff0c1;
                border-color: #6c4800;
                box-shadow: inset 0 0 0 max(1px, 0.18cqw) #eabf13;
            }

            .pollen-grain--paid::before {
                background: #fff0c1;
                border-color: #eabf13;
            }

            .pollen-grain--paid::after {
                background: #fff9e9;
            }

            .playing .pollen-grain--in {
                animation: pollen-flight 1.4s cubic-bezier(0.28, 0.74, 0.32, 1)
                    var(--pollen-delay) both;
            }

            .pollen-grain--out {
                --pollen-mid-x: 20cqw;
                --pollen-target-x: 42cqw;
                --pollen-mid-y: -7cqw;
                --pollen-target-y: -15cqw;
                top: 80%;
                left: var(--pollen-source);
                width: 2.2cqw;
            }

            .playing .pollen-grain--out {
                animation: pollen-spend 2.1s cubic-bezier(0.3, 0.65, 0.32, 1)
                    var(--pollen-delay) both;
            }

            .pollen-grain--revenue {
                top: 51%;
                left: 54%;
                width: 1.8cqw;
            }

            .playing .pollen-grain--revenue {
                animation: pollen-revenue 1.35s cubic-bezier(0.28, 0.72, 0.3, 1)
                    var(--pollen-delay) both;
            }

            .pollen-stream {
                display: contents;
            }

            .spark {
                position: absolute;
                z-index: 11;
                left: var(--x);
                bottom: var(--y);
                width: 1.35cqw;
                aspect-ratio: 1;
                background: #ecf874;
                box-shadow: 0 -100% #fff9c7, 100% 0 #fff9c7, 0 100% #fff9c7,
                    -100% 0 #fff9c7;
                filter: drop-shadow(1px 2px 0 rgb(17 5 24 / 48%));
                visibility: hidden;
            }

            .playing .spark {
                animation: wallet-spark var(--start-free-duration) linear both;
                animation-delay: calc(var(--start-free-start) + var(--spark-delay));
            }

            .phase-banner {
                position: absolute;
                z-index: 12;
                top: -6%;
                left: 50%;
                width: 88cqw;
                image-rendering: pixelated;
                filter: drop-shadow(5px 8px 0 rgb(17 5 24 / 18%));
                visibility: hidden;
                transform: translate(-50%, -145%) rotate(-2deg);
                transform-origin: 50% 0;
            }

            .playing .phase-banner {
                animation: phase-banner var(--phase-duration) linear var(--phase-start) both;
            }

            .capability-friend {
                position: absolute;
                z-index: 10;
                bottom: calc(27.5% - var(--friend-ground-offset, 0cqw));
                left: 0;
                width: var(--friend-size, 21cqw);
                aspect-ratio: 1;
                image-rendering: pixelated;
                filter: drop-shadow(5px 7px 0 rgb(17 5 24 / 18%));
                visibility: hidden;
                transform: translateX(110cqw);
                pointer-events: none;
            }

            .capability-friend__frame {
                position: absolute;
                inset: 0;
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
                visibility: hidden;
            }

            .playing .capability-friend {
                animation: capability-cross var(--friend-duration) linear var(--friend-start) both;
            }

            .playing .capability-friend__frame--one {
                animation: capability-frame-one 560ms steps(1, end) var(--friend-start) infinite;
            }

            .playing .capability-friend__frame--two {
                animation: capability-frame-two 560ms steps(1, end) var(--friend-start) infinite;
            }

            .playing .capability-friend__frame--three {
                animation: capability-frame-three 560ms steps(1, end) var(--friend-start) infinite;
            }

            .world-props {
                position: absolute;
                inset: 0 auto 0 0;
                z-index: 8;
                width: var(--world-width, 100%);
                pointer-events: none;
                visibility: hidden;
            }

            .playing .world-props {
                visibility: visible;
            }

            .playing .world,
            .playing .opening-props,
            .playing .world-props {
                animation:
                    world-travel-to-revenue var(--revenue-start) linear forwards,
                    world-travel-to-community calc(var(--preview) - var(--community-start)) linear
                        var(--community-start) forwards;
            }

            .build-landmark {
                position: absolute;
                bottom: var(--landmark-bottom, 24%);
                left: 0;
                width: var(--landmark-size, 30cqw);
                transform: translateX(-50%);
                transform-origin: 50% 100%;
                image-rendering: pixelated;
            }

            .build-landmark__scene {
                position: relative;
                width: 100%;
                transform-origin: 50% 100%;
            }

            .playing .build-landmark__scene {
                animation: landmark-activate 3.3s ease-in-out
                    calc(var(--landmark-center) - 1.45s) both;
            }

            .playing .build-landmark--burst .build-landmark__scene {
                animation: landmark-seed-burst 1.05s cubic-bezier(0.2, 0.82, 0.28, 1.18)
                    calc(var(--landmark-center) - 1.15s) both;
            }

            .landmark-burst {
                position: absolute;
                bottom: 5%;
                left: 50%;
                z-index: 4;
                width: 7%;
                aspect-ratio: 1;
                border-radius: 50%;
                background: #ecf874;
                box-shadow:
                    -3.2cqw -0.7cqw 0 -0.4cqw #f8d86b,
                    3.2cqw -0.7cqw 0 -0.4cqw #f8d86b,
                    -2.1cqw -2.4cqw 0 -0.5cqw #8ff0af,
                    2.1cqw -2.4cqw 0 -0.5cqw #8ff0af,
                    -4.2cqw -2cqw 0 -0.55cqw #fff2bd,
                    4.2cqw -2cqw 0 -0.55cqw #fff2bd;
                visibility: hidden;
                transform: translate(-50%, 50%) scale(0);
            }

            .playing .build-landmark--burst .landmark-burst {
                animation: landmark-burst-particles 720ms steps(6, end)
                    calc(var(--landmark-center) - 0.94s) both;
            }

            .build-landmark__asset {
                display: block;
                width: 100%;
                height: auto;
                image-rendering: pixelated;
                filter: drop-shadow(5px 8px 0 rgb(17 5 24 / 16%));
            }

            .build-landmark--cli .build-landmark__asset {
                animation: terminal-glow 1.4s steps(2, end) infinite;
            }

            .build-landmark--wallet .build-landmark__asset {
                animation: wallet-glow 1.9s steps(2, end) infinite;
            }

            .build-landmark--mcp .build-landmark__asset {
                animation: connector-glow 1.8s ease-in-out infinite;
            }

            .build-landmark--storage .build-landmark__asset {
                animation: storage-breathe 2.4s ease-in-out infinite;
            }

            .revenue-stage {
                position: absolute;
                inset: 15% 0 0;
                z-index: 9;
                overflow: hidden;
                pointer-events: none;
            }

            .playing .revenue-stage {
                z-index: 21;
            }

            .revenue-station,
            .revenue-visitor,
            .revenue-delivery,
            .revenue-burst {
                position: absolute;
                visibility: hidden;
            }

            .revenue-station {
                bottom: 25%;
                left: 50%;
                display: block;
                width: 30cqw;
                max-height: 96%;
                object-fit: contain;
                image-rendering: pixelated;
                filter: drop-shadow(5px 8px 0 rgb(17 5 24 / 18%));
                transform-origin: 50% 100%;
                backface-visibility: hidden;
                will-change: transform;
            }

            .revenue-visitor {
                z-index: 1;
                display: grid;
                width: 15%;
                aspect-ratio: 1;
                place-items: center;
                will-change: transform;
            }

            .revenue-visitor img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: contain;
                image-rendering: pixelated;
                filter: drop-shadow(4px 6px 0 rgb(17 5 24 / 18%));
                animation: revenue-visitor-idle 720ms steps(2, end) infinite;
            }

            .revenue-visitor--sky {
                top: 13%;
                right: 6%;
            }

            .revenue-visitor--moss {
                bottom: 28%;
                left: 12%;
            }

            .revenue-visitor--lantern {
                right: 7%;
                bottom: 11%;
            }

            .revenue-delivery {
                top: 48%;
                left: 50%;
                z-index: 3;
                width: 6.5cqw;
                aspect-ratio: 1;
                border: 3px solid #2b173b;
                border-radius: 5px;
                image-rendering: pixelated;
                filter: drop-shadow(3px 4px 0 rgb(17 5 24 / 24%));
                transform: translate(-50%, -50%) scale(0);
                transform-origin: 50% 50%;
            }

            .revenue-delivery::before,
            .revenue-delivery::after {
                position: absolute;
                content: "";
            }

            .revenue-delivery--image {
                background: linear-gradient(#9edcff 0 52%, #8ee6a8 52% 100%);
            }

            .revenue-delivery--image::before {
                top: 17%;
                right: 17%;
                width: 20%;
                aspect-ratio: 1;
                border-radius: 50%;
                background: #fff39b;
                box-shadow: 0 0 0 2px #f8c95b;
            }

            .revenue-delivery--image::after {
                right: 10%;
                bottom: 10%;
                left: 10%;
                height: 42%;
                background: linear-gradient(135deg, transparent 38%, #456f72 39% 54%, transparent 55%),
                    linear-gradient(45deg, #39785f 0 46%, transparent 47%);
            }

            .revenue-delivery--text {
                aspect-ratio: 4 / 3;
                background: #fff2bd;
            }

            .revenue-delivery--text::before {
                inset: 22% 16%;
                background: repeating-linear-gradient(
                    to bottom,
                    #5e3a62 0 3px,
                    transparent 3px 8px
                );
            }

            .revenue-delivery--video {
                background: #d78cff;
            }

            .revenue-delivery--video::before {
                top: 25%;
                left: 34%;
                width: 0;
                height: 0;
                border-top: 10px solid transparent;
                border-bottom: 10px solid transparent;
                border-left: 15px solid #fff2bd;
                filter: drop-shadow(2px 2px 0 #6a3b7e);
            }

            .revenue-burst {
                top: 48%;
                left: 50%;
                width: 2.2%;
                aspect-ratio: 1;
                border-radius: 50%;
                background: #ecf874;
                box-shadow:
                    -9cqw -4cqh 0 #f8d86b,
                    9cqw -5cqh 0 #8ff0af,
                    -12cqw 5cqh 0 #fff2bd,
                    11cqw 7cqh 0 #d78cff,
                    -4cqw -10cqh 0 #61c380,
                    4cqw 11cqh 0 #ecf874;
                transform: translate(-50%, -50%) scale(0);
            }

            .playing .revenue-station--app {
                animation: revenue-app-station var(--revenue-duration) linear
                    var(--revenue-start) both;
            }

            .playing .revenue-station--model {
                animation: revenue-model-station var(--revenue-duration) linear
                    var(--revenue-start) both;
            }

            .playing .revenue-station--agent {
                animation: revenue-agent-station var(--revenue-duration) linear
                    var(--revenue-start) both;
            }

            .playing .revenue-visitor--sky {
                animation:
                    revenue-sky-visitor var(--revenue-duration) linear var(--revenue-start) both,
                    community-sky-travel var(--community-duration) linear var(--community-start)
                        forwards,
                    community-visitor-resize 650ms ease-in-out
                        calc(var(--community-start) - 0.55s) forwards;
            }

            .playing .revenue-visitor--moss {
                animation:
                    revenue-moss-visitor var(--revenue-duration) linear var(--revenue-start) both,
                    community-moss-travel var(--community-duration) linear var(--community-start)
                        forwards,
                    community-visitor-resize 650ms ease-in-out
                        calc(var(--community-start) - 0.55s) forwards;
            }

            .playing .revenue-visitor--lantern {

                        data-center-time="32.9"

                    >

                                alt="Media Storage archive for image, audio and video"
                            />

                            <i class="storage-light" style="--pulse-delay: 0s"></i>

                <button type="button" data-phase-var="--build-start">Build Your Way</button>
                <button type="button" data-phase-var="--revenue-transition-start">
                    Connect · Publish · Earn
                </button>
                <button type="button" data-phase-var="--community-start">Community</button>
            </nav>
        </main>

        <script>
            const viewport = document.querySelector("#viewport");
            const world = document.querySelector("#world");
            const openingProps = document.querySelector("#opening-props");
            const worldProps = document.querySelector("#world-props");
            const communityFinaleWorld = document.querySelector("#community-finale-world");
            const buildLandmarks = [...document.querySelectorAll(".build-landmark")];
            const phaseControls = [
                ...document.querySelectorAll("[data-phase-time], [data-phase-var]"),
            ];
            const pollenStream = document.querySelector("#pollen-stream");
            const questPollenStream = document.querySelector("#quest-pollen-stream");
            const revenuePollenStream = document.querySelector("#revenue-pollen-stream");
            const arrivalHoldMs = 1000;
            const arrivalDurationMs = 4200;
            let arrivalTimer;
            let playTimer;

            const questRewardBursts = [
                { start: 5.3, count: 5, spacing: 0.14 },
                { start: 7.2, count: 14, spacing: 0.1 },
            ];

            for (const burst of questRewardBursts) {
                for (let index = 0; index < burst.count; index += 1) {
                    const grain = document.createElement("i");
                    grain.className = "pollen-grain pollen-grain--in";
                    grain.style.setProperty(
                        "--pollen-delay",
                        `calc(var(--start-free-start) + ${burst.start + index * burst.spacing}s)`,
                    );
                    grain.style.setProperty("--arc-x", `${((index % 7) - 3) * 0.9}cqw`);
                    grain.style.setProperty("--arc-y", `${((index % 5) - 2) * 0.75}cqw`);
                    questPollenStream.append(grain);
                }
            }

            const mediaFirstCenter = 16.1;
            const mediaLastCenter = 21.2;
            const pollenSpendDuration = 2.1;
            const pollenStep = 0.55;
            const pollenBursts = Math.floor(
                (mediaLastCenter - mediaFirstCenter - pollenSpendDuration) / pollenStep,
            );

            for (let index = 0; index <= pollenBursts; index += 1) {
                for (const account of ["paid", "quest"]) {
                    const grain = document.createElement("i");
                    grain.className = `pollen-grain pollen-grain--out${
                        account === "paid" ? " pollen-grain--paid" : ""
                    }`;
                    grain.style.setProperty(
                        "--pollen-delay",
                        `${mediaFirstCenter + index * pollenStep + (account === "quest" ? 0.16 : 0)}s`,
                    );
                    grain.style.setProperty("--pollen-source", account === "paid" ? "14%" : "26%");
                    const targetX =
                        (account === "paid" ? 40 : 32) + ((index % 4) - 1.5) * 3;
                    grain.style.setProperty("--pollen-mid-x", `${targetX * 0.46}cqw`);
                    grain.style.setProperty("--pollen-target-x", `${targetX}cqw`);
                    grain.style.setProperty(
                        "--pollen-target-y",
                        `${-14 - (index % 3) * 0.8}cqw`,
                    );
                    pollenStream.append(grain);
                }
            }

            for (const beatStart of [1.05, 3.55, 6.35]) {
                for (let index = 0; index < 6; index += 1) {
                    for (const account of ["paid", "quest"]) {
                        const grain = document.createElement("i");
                        grain.className = `pollen-grain pollen-grain--revenue${
                            account === "paid" ? " pollen-grain--paid" : ""
                        }`;
                        grain.style.setProperty(
                            "--pollen-delay",
                            `calc(var(--revenue-start) + ${beatStart + index * 0.12 + (account === "quest" ? 0.06 : 0)}s)`,
                        );
                        grain.style.setProperty(
                            "--earn-target-x",
                            account === "paid" ? "-30cqw" : "-21cqw",
                        );
                        grain.style.setProperty(
                            "--earn-mid-x",
                            account === "paid" ? "-14cqw" : "-10cqw",
                        );
                        grain.style.setProperty(
                            "--earn-late-x",
                            account === "paid" ? "-24cqw" : "-17cqw",
                        );
                        revenuePollenStream.append(grain);
                    }
                }
            }

            function setJourney() {
                const rootStyles = getComputedStyle(document.documentElement);
                const seconds = (property) => Number.parseFloat(rootStyles.getPropertyValue(property));
                const viewportWidth = viewport.getBoundingClientRect().width;
                const worldWidth = world.getBoundingClientRect().width;
                const communityWorldWidth = communityFinaleWorld.getBoundingClientRect().width;
                const maximumTravel = Math.max(0, worldWidth - viewportWidth);
                const pixelsPerSecond = maximumTravel / seconds("--panorama-duration");
                const pauseStart = seconds("--revenue-start");
                const pauseDuration = seconds("--community-start") - pauseStart;
                const movingDuration = seconds("--preview") - pauseDuration;

                openingProps.style.width = `${worldWidth}px`;
                worldProps.style.width = `${worldWidth}px`;
                for (const landmark of buildLandmarks) {
                    const centerTime = Number(landmark.dataset.centerTime);
                    landmark.style.setProperty("--landmark-center", `${centerTime}s`);
                    landmark.style.left = `${pixelsPerSecond * centerTime + viewportWidth * 0.65}px`;
                }

                viewport.style.setProperty(
                    "--world-end",
                    `${-(pixelsPerSecond * movingDuration)}px`,
                );
                viewport.style.setProperty(
                    "--world-pause",
                    `${-(pixelsPerSecond * pauseStart)}px`,
                );
                viewport.style.setProperty(
                    "--community-travel",
                    `${communityWorldWidth * -0.4}px`,
                );
            }

            function play() {
                viewport.classList.remove("arriving");
                viewport.classList.remove("playing");
                void viewport.offsetWidth;
                viewport.classList.add("playing");
            }

            function playFrom(seconds) {
                window.clearTimeout(arrivalTimer);
                window.clearTimeout(playTimer);
                viewport.classList.remove("arriving");
                setJourney();
                play();
                window.requestAnimationFrame(() => {
                    for (const animation of viewport.getAnimations({ subtree: true })) {
                        animation.currentTime = seconds * 1000;
                    }
                });
            }

            function begin() {
                window.clearTimeout(arrivalTimer);
                window.clearTimeout(playTimer);
                viewport.classList.remove("arriving");
                viewport.classList.remove("playing");
                setJourney();
                arrivalTimer = window.setTimeout(() => {
                    viewport.classList.add("arriving");
                    playTimer = window.setTimeout(play, arrivalDurationMs);
                }, arrivalHoldMs);
            }

            if (world.complete) {
                begin();
            } else {
                world.addEventListener("load", begin);
            }
            window.addEventListener("resize", setJourney);
            for (const control of phaseControls) {
                control.addEventListener("click", () => {
                    const seconds = control.dataset.phaseVar
                        ? Number.parseFloat(
                              getComputedStyle(document.documentElement).getPropertyValue(
                                  control.dataset.phaseVar,
                              ),
                          )
                        : Number(control.dataset.phaseTime);
                    if (seconds === 0) {
                        begin();
                    } else {
                        playFrom(seconds);
                    }
                });
            }
        </script>
